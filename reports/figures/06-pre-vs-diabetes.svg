<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 458" width="860" height="458" role="img" aria-label="Pré-diabetes vs diabetes"><style>
:root{--superficie:#fcfcfb;--plano:#f9f9f7;--tinta:#0b0b0b;--tinta2:#52514e;--tinta3:#898781;--grade:#e1e0d9;--eixo:#c3c2b7;--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--neutro:#f0efec;--queda:#d03b3b;--borda:rgba(11,11,11,0.10);}
@media (prefers-color-scheme: dark){:root{--superficie:#1a1a19;--plano:#0d0d0d;--tinta:#ffffff;--tinta2:#c3c2b7;--tinta3:#898781;--grade:#2c2c2a;--eixo:#383835;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--neutro:#383835;--queda:#e66767;--borda:rgba(255,255,255,0.10);}}
text{font-family:system-ui, -apple-system, "Segoe UI", sans-serif;fill:var(--tinta)}
.rot{fill:var(--tinta2);font-size:12px}
.eixo{fill:var(--tinta3);font-size:11px}
.titulo{fill:var(--tinta);font-size:15px;font-weight:600}
.sub{fill:var(--tinta2);font-size:12px}
.grade{stroke:var(--grade);stroke-width:1}
.base{stroke:var(--eixo);stroke-width:1}
.val{fill:var(--tinta);font-size:11px;font-variant-numeric:tabular-nums}
</style><rect width="860" height="458" fill="var(--superficie)"/><text x="20.0" y="30.0" class="titulo" text-anchor="start" >Pré-diabetes e diabetes não são o mesmo continuum</text><text x="20.0" y="50.0" class="sub" text-anchor="start" >Odds ratio de cada classe contra “sem diabetes”. Mostradas só as variáveis cujos IC 95% não se sobrepõem.</text><circle cx="25.0" cy="70.0" r="5" fill="#2a78d6"/><text x="35.0" y="74.0" class="rot" text-anchor="start" >diabetes vs. sem</text><circle cx="165.6" cy="70.0" r="5" fill="#1baf7a"/><text x="175.6" y="74.0" class="rot" text-anchor="start" >pré-diabetes vs. sem</text><line x1="232.5" y1="92" x2="232.5" y2="366.0" class="grade"/><text x="232.5" y="384.0" class="eixo" text-anchor="middle" >0,5</text><line x1="343.9" y1="92" x2="343.9" y2="366.0" class="grade"/><text x="343.9" y="384.0" class="eixo" text-anchor="middle" >0,7</text><line x1="461.9" y1="92" x2="461.9" y2="366.0" class="grade"/><text x="461.9" y="384.0" class="eixo" text-anchor="middle" >1</text><line x1="596.1" y1="92" x2="596.1" y2="366.0" class="grade"/><text x="596.1" y="384.0" class="eixo" text-anchor="middle" >1,5</text><line x1="691.4" y1="92" x2="691.4" y2="366.0" class="grade"/><text x="691.4" y="384.0" class="eixo" text-anchor="middle" >2</text><line x1="461.9" y1="92" x2="461.9" y2="366.0" stroke="var(--eixo)" stroke-width="1.5" stroke-dasharray="3 3"/><text x="198.0" y="114.0" class="rot" text-anchor="end" >álcool excessivo</text><line x1="416.6" y1="110.0" x2="244.9" y2="110.0" stroke="var(--eixo)" stroke-width="2" stroke-linecap="round"/><circle cx="416.6" cy="110.0" r="5" fill="var(--s3)" stroke="var(--superficie)" stroke-width="2" data-t="álcool excessivo — pré-diabetes: OR 0,87 [0,66; 1,15]" class="hv"/><circle cx="244.9" cy="110.0" r="5" fill="var(--s1)" stroke="var(--superficie)" stroke-width="2" data-t="álcool excessivo — diabetes: OR 0,52 [0,45; 0,60]" class="hv"/><text x="754.0" y="114.0" class="val" text-anchor="start" >0,87 → 0,52</text><text x="198.0" y="144.0" class="rot" text-anchor="end" >hipertensão</text><line x1="589.5" y1="140.0" x2="708.5" y2="140.0" stroke="var(--eixo)" stroke-width="2" stroke-linecap="round"/><circle cx="589.5" cy="140.0" r="5" fill="var(--s3)" stroke="var(--superficie)" stroke-width="2" data-t="hipertensão — pré-diabetes: OR 1,47 [1,29; 1,68]" class="hv"/><circle cx="708.5" cy="140.0" r="5" fill="var(--s1)" stroke="var(--superficie)" stroke-width="2" data-t="hipertensão — diabetes: OR 2,11 [1,98; 2,24]" class="hv"/><text x="754.0" y="144.0" class="val" text-anchor="start" >1,47 → 2,11</text><text x="198.0" y="174.0" class="rot" text-anchor="end" >doença cardíaca ⟳</text><line x1="435.4" y1="170.0" x2="535.3" y2="170.0" stroke="var(--eixo)" stroke-width="2" stroke-linecap="round"/><circle cx="435.4" cy="170.0" r="5" fill="var(--s3)" stroke="var(--superficie)" stroke-width="2" data-t="doença cardíaca — pré-diabetes: OR 0,92 [0,76; 1,12]" class="hv"/><circle cx="535.3" cy="170.0" r="5" fill="var(--s1)" stroke="var(--superficie)" stroke-width="2" data-t="doença cardíaca — diabetes: OR 1,25 [1,15; 1,35]" class="hv"/><text x="754.0" y="174.0" class="val" text-anchor="start" >0,92 → 1,25</text><text x="198.0" y="204.0" class="rot" text-anchor="end" >saúde geral</text><line x1="558.6" y1="200.0" x2="656.9" y2="200.0" stroke="var(--eixo)" stroke-width="2" stroke-linecap="round"/><circle cx="558.6" cy="200.0" r="5" fill="var(--s3)" stroke="var(--superficie)" stroke-width="2" data-t="saúde geral — pré-diabetes: OR 1,34 [1,24; 1,44]" class="hv"/><circle cx="656.9" cy="200.0" r="5" fill="var(--s1)" stroke="var(--superficie)" stroke-width="2" data-t="saúde geral — diabetes: OR 1,80 [1,74; 1,87]" class="hv"/><text x="754.0" y="204.0" class="val" text-anchor="start" >1,34 → 1,80</text><text x="198.0" y="234.0" class="rot" text-anchor="end" >sexo (masculino)</text><line x1="462.9" y1="230.0" x2="537.4" y2="230.0" stroke="var(--eixo)" stroke-width="2" stroke-linecap="round"/><circle cx="462.9" cy="230.0" r="5" fill="var(--s3)" stroke="var(--superficie)" stroke-width="2" data-t="sexo (masculino) — pré-diabetes: OR 1,00 [0,89; 1,14]" class="hv"/><circle cx="537.4" cy="230.0" r="5" fill="var(--s1)" stroke="var(--superficie)" stroke-width="2" data-t="sexo (masculino) — diabetes: OR 1,26 [1,19; 1,33]" class="hv"/><text x="754.0" y="234.0" class="val" text-anchor="start" >1,00 → 1,26</text><text x="198.0" y="264.0" class="rot" text-anchor="end" >IMC</text><line x1="549.8" y1="260.0" x2="601.8" y2="260.0" stroke="var(--eixo)" stroke-width="2" stroke-linecap="round"/><circle cx="549.8" cy="260.0" r="5" fill="var(--s3)" stroke="var(--superficie)" stroke-width="2" data-t="IMC — pré-diabetes: OR 1,30 [1,24; 1,37]" class="hv"/><circle cx="601.8" cy="260.0" r="5" fill="var(--s1)" stroke="var(--superficie)" stroke-width="2" data-t="IMC — diabetes: OR 1,53 [1,49; 1,57]" class="hv"/><text x="754.0" y="264.0" class="val" text-anchor="start" >1,30 → 1,53</text><text x="198.0" y="294.0" class="rot" text-anchor="end" >escolaridade</text><line x1="406.2" y1="290.0" x2="450.2" y2="290.0" stroke="var(--eixo)" stroke-width="2" stroke-linecap="round"/><circle cx="406.2" cy="290.0" r="5" fill="var(--s3)" stroke="var(--superficie)" stroke-width="2" data-t="escolaridade — pré-diabetes: OR 0,84 [0,80; 0,90]" class="hv"/><circle cx="450.2" cy="290.0" r="5" fill="var(--s1)" stroke="var(--superficie)" stroke-width="2" data-t="escolaridade — diabetes: OR 0,96 [0,94; 0,99]" class="hv"/><text x="754.0" y="294.0" class="val" text-anchor="start" >0,84 → 0,96</text><text x="198.0" y="324.0" class="rot" text-anchor="end" >idade</text><line x1="582.4" y1="320.0" x2="626.1" y2="320.0" stroke="var(--eixo)" stroke-width="2" stroke-linecap="round"/><circle cx="582.4" cy="320.0" r="5" fill="var(--s3)" stroke="var(--superficie)" stroke-width="2" data-t="idade — pré-diabetes: OR 1,44 [1,34; 1,54]" class="hv"/><circle cx="626.1" cy="320.0" r="5" fill="var(--s1)" stroke="var(--superficie)" stroke-width="2" data-t="idade — diabetes: OR 1,64 [1,59; 1,70]" class="hv"/><text x="754.0" y="324.0" class="val" text-anchor="start" >1,44 → 1,64</text><text x="198.0" y="354.0" class="rot" text-anchor="end" >dias de saúde mental ⟳</text><line x1="485.0" y1="350.0" x2="446.4" y2="350.0" stroke="var(--eixo)" stroke-width="2" stroke-linecap="round"/><circle cx="485.0" cy="350.0" r="5" fill="var(--s3)" stroke="var(--superficie)" stroke-width="2" data-t="dias de saúde mental — pré-diabetes: OR 1,07 [1,02; 1,13]" class="hv"/><circle cx="446.4" cy="350.0" r="5" fill="var(--s1)" stroke="var(--superficie)" stroke-width="2" data-t="dias de saúde mental — diabetes: OR 0,95 [0,93; 0,98]" class="hv"/><text x="754.0" y="354.0" class="val" text-anchor="start" >1,07 → 0,95</text><text x="20.0" y="412.0" class="rot" text-anchor="start" >⟳ = o fator inverte de direção entre as duas classes. Sexo tem OR 1,00 no pré-diabetes e 1,26 no diabetes.</text><text x="20.0" y="432.0" class="rot" text-anchor="start" >Nove variáveis divergem: a hipótese de odds proporcionais é rejeitada e a especificação correta é a multinomial.</text></svg>