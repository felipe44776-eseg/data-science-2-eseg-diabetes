[project]
name = "diabetes-eseg"
version = "0.1.0"
description = "Data Science 2 - Projeto 1: analise de diabetes (BRFSS 2015)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
